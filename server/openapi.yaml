    Area:
      type: object
      properties:
        key:
          type: string
        id:
          type: integer
        plateName:
          type: string
        officialName:
          type: string
        provisionalName:
          type: boolean
        zone:
          type: string
        zoneName:
          type: string
        index:
          type: string
        nameKey:
          type: string
        nameId:
          type: integer
        digits:
          type: integer
        blocks:
          type: array
          items:
            type: array
            items:
              type: integer
        codes:
          type: integer
        compoundsAtFirstIssue:
          type: integer
        place:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
          required:
          - lat
          - lng
        frame:
          type: array
          items:
            type: number
        alertZone:
          type: boolean
        nameRange:
          type: object
    AreasNamed:
      type: object
      properties:
        name:
          type: string
        total:
          type: integer
        areas:
          type: array
          items:
            type: object
    IssueRequest:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
        lng:
          type: number
        outline:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          maxItems: 500
        of:
          type: string
          description: Machine code of the compound this is another door of.
    ChangeRequest:
      type: object
      properties:
        status:
          enum:
          - provisional
          - confirmed
          - retired
        entrance:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
            kind:
              enum:
              - gate
              - door
          required:
          - lat
          - lng
  securitySchemes:
    issuingKey:
      type: http
      scheme: bearer
      description: One of the deployment's ISSUE_KEYS. Only the designated issuer's deployment has keys.
