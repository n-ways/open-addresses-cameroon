                  official_name: Bonapriso
                  number: '2286'
                  check: '3'
                  status: confirmed
                  issued: on-demand
                  issued_at: '2026-10-21T15:04:38Z'
                  entrance_lat: '4.0243022'
                  entrance_lng: '9.6905933'
                  entrance_kind: centre
                  spot_code: CM-DLA1 E0450 N0268
                  official_address: ''
                  class: residential
