  /v1/codes:
    post:
      summary: Issues a code for a new compound, or for another door of a compound (`of`).
      description: 'Issues a code for a new compound, or for another door of a compound (`of`). Needs `Authorization: Bearer
        <key>` and exists only on the designated issuer''s deployment. Body: `lat`, `lng`, optionally `outline` (`[lng, lat]`
        points) or `of` (a machine code). The rules are those of the N-Ways issuer ([server/README.md](../server/README.md#how-issue-works)).
        The new code is provisional. The point must be in Cameroon, as for `GET /v1/at`: in an arrondissement outline, or
        in no outline but given a zone by the spot-code rule (422 outside otherwise). The border decides: a point more than
        300 m outside the national border (OpenStreetMap, admin_level 2) is in a neighbouring country and is refused (422
        outside), even where the spot-code rule gives it a zone.'
      operationId: issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
            example:
              lat: 4.0243022
              lng: 9.6905933
              outline:
              - - 9.6904933
                - 4.0242522
              - - 9.6906933
                - 4.0242522
              - - 9.6906933
                - 4.0243522
              - - 9.6904933
                - 4.0243522
