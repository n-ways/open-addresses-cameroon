                  code: bad_radius
                  message: radius is in metres, more than 0 and at most 500.
  /v1/verify:
    get:
      summary: 'Checks a machine code: its syntax, its area, its blocks, its check digit and whether a compound holds it.'
      description: 'Checks a machine code: its syntax, its area, its blocks, its check digit and whether a compound holds
        it. A wrong check digit is reported, never corrected.'
      operationId: verify
      parameters:
      - name: code
        in: query
        required: true
        description: A machine code.
        schema:
          type: string
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify'
              example:
                code: CM-DLA1-015-1401-6
                syntax: true
                checkDigit: ok
                inBlocks: true
                valid: true
                issued: true
                area: DLA1-015
                status: provisional
                machine: CM-DLA1-015-1401-6
                home: Bonapriso 1401
        '400':
          description: No code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: missing_code
                  message: The query parameter code is required.
  /v1/spot:
    get:
      summary: 'The spot code of a point: its 10 m cell on its arrondissement''s frozen frame, and the cell centre.'
      description: 'The spot code of a point: its 10 m cell on the frozen frame of the arrondissement whose outline holds it, and
        the cell centre. A point in no outline takes the arrondissement with the nearest outline within 12 km whose frame holds
        it (ties to the lower key), or else the nearest cell of a frame at most 5,000 m away (engine/SPEC.md §5). A point farther
        away is outside Cameroon (404).'
      operationId: spot
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude.
        schema:
          type: number
      - name: lng
        in: query
        required: true
        description: Longitude.
        schema:
          type: number
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spot'
              example:
                spot: CM-DLA1 E0449 N0268
                zone:
                  key: DLA1
                  name: Douala I
                  nameEn: Douala 1
                  region: CM-LT
                  language: fr
                  index: 20
                cellM: 10
                centre:
                  lat: 4.0242824
                  lng: 9.6904802
        '404':
          description: Outside Cameroon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: outside
                  message: The point is outside Cameroon.
  /v1/spot/decode:
    get:
      summary: The centre of a spot code's cell, and the code of the compound within 15 m of it, if any.
      description: The centre of a spot code's cell, and the code of the compound within 15 m of it, if any.
      operationId: spotDecode
      parameters:
      - name: code
        in: query
        required: true
        description: A spot code, CM-<zone> E<east> N<north>.
        schema:
          type: string
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotDecode'
              example:
                spot: CM-DLA1 E0449 N0268
                zone:
                  key: DLA1
                  name: Douala I
                  nameEn: Douala 1
                  region: CM-LT
