  /v1/find:
    get:
      summary: 'Finds a code from what a person says or types: a remembered or written form in any spacing, case or accents
        (`Bonapriso 14 01`, `bonapriso1401`), an official name in place of the plate name, a machine form, an official address,
        or a spot code.'
      description: 'Finds a code from what a person says or types: a remembered or written form in any spacing, case or accents
        (`Bonapriso 14 01`, `bonapriso1401`), an official name in place of the plate name, a machine form, an official address,
        or a spot code. A check digit sent by a system after a hyphen is verified; a wrong one is refused, never guessed.
        `limit` (1-100, default 20) caps the matches of an official address.'
      operationId: find
      parameters:
      - name: q
        in: query
        required: true
        description: A remembered or written form, a machine form, an official address or a spot code.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Most matches of an official address (1-100, default 20).
        schema:
          type: integer
      security: []
      responses:
        '200':
          description: A remembered form, typed loosely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Find'
              example:
                query: bonapriso 1401
                kind: remembered
                matches:
                - country: CM
                  machine: CM-DLA1-015-1401-6
                  home: Bonapriso 1401
                  written: Bonapriso 14 01
                  spoken: Bonapriso, 14 01
                  number: 1401
                  check: 6
                  status: provisional
