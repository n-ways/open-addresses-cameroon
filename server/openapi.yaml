# OpenAPI 3.1 description of the registry API of N-Ways Addressing for Cameroon (server/).
# Every example is a real response of the server on the published registry (docs/api.md).
openapi: 3.1.0
info:
  title: 'N-Ways Addressing for Cameroon: registry API'
  version: 1.0.0
  description: 'The API of the registry server in server/: every published code of Cameroon, look-ups by remembered form,
    machine form, official address, spot code and point, and on-demand issue by the rules of engine/SPEC.md. Every response
    is JSON; every error is {"error": {"code", "message"}}. Data: ODbL 1.0; credit "N-Ways Addressing for Cameroon, © N-WAYS
    LIMITED (nways.ng)". Every example is a real response of the server on the published registry (docs/api.md).'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: N-WAYS LIMITED
    url: https://nways.ng
    email: hello@nways.ng
servers:
- url: http://localhost:8080
  description: A local deployment (docker compose up)
paths:
  /v1/health:
    get:
      summary: Liveness and the registry served.
      description: Liveness and the registry served.
      operationId: health
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                country: CM
                codes: 7243272
                registryExported: '2026-10-21T14:51:04Z'
                issuing: true
        '404':
          description: An endpoint that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: There is no endpoint /v1/codez; see /v1/info and docs/api.md.
        '405':
          description: A method an endpoint does not allow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: method_not_allowed
                  message: DELETE is not allowed here; use GET.
  /v1/info:
    get:
      summary: The country, its arrondissements and counts, licences, credit line and engine.
      description: The country, its arrondissements and counts, licences, credit line and engine.
      operationId: info
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
              example:
                country: CM
                name: Cameroon
                codes: 7243272
                byStatus:
                  provisional: 7243272
                byIssue:
                  bulk: 7243272
                zones:
                - key: BAF1
                  name: Bafoussam I
                  nameEn: Bafoussam 1
                  region: CM-OU
                  codes: 48996
                  areas: 48
                - key: BAF2
                  name: Bafoussam II
                  nameEn: Bafoussam 2
                  region: CM-OU
                  codes: 52427
                  areas: 51
                - key: BAF3
                  name: Bafoussam III
                  nameEn: Bafoussam 3
                  region: CM-OU
                  codes: 48900
                  areas: 51
                areas: 24213
                areasWithCodes: 23208
                names: 17240
                registryExported: '2026-10-21T14:51:04Z'
                importedAt: '2026-10-21T14:59:35Z'
                engine: internal/addressing/cm (SPEC v1.0)
                spec: engine/SPEC.md
                licences:
                  data: ODbL 1.0 (LICENSE-DATA)
                  code: Apache-2.0 (LICENSE)
                  documents: CC BY 4.0 (LICENSE-DOCS)
                credit: N-Ways Addressing for Cameroon, © N-WAYS LIMITED (nways.ng)
                creditUrl: https://github.com/n-ways/open-addresses-cameroon
                issuing: true
                issuePerDay: 50
                example:
                  remembered: Bonapriso 14 01
                  machine: CM-DLA1-015-1401-6
                  spot: CM-DLA1 E0449 N0268
  /v1/codes/{machine}:
    get:
      summary: 'The full card of an issued code: every registry column under `record`, named, with the spot code, Plus Code,
        area, arrondissement, and the remembered, written and spoken forms.'
      description: 'The full card of an issued code: every registry column under `record`, named, with the spot code, Plus
        Code, area, arrondissement, and the remembered, written and spoken forms. People see the remembered or written form,
        never the check digit.'
      operationId: getCode
      parameters:
      - name: machine
        in: path
        required: true
        description: Machine form with its check digit.
        schema:
          type: string
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              example:
                country: CM
                machine: CM-DLA1-015-1401-6
                home: Bonapriso 1401
                written: Bonapriso 14 01
                spoken: Bonapriso, 14 01
                number: 1401
                check: 6
                status: provisional
                issued: bulk
                issuedAt: '2026-10-21T06:05:31Z'
                area:
                  key: DLA1-015
                  id: 4368
                  plateName: Bonapriso
                  officialName: Bonapriso
                  provisionalName: false
                  zone: DLA1
                  zoneName: Douala I
                zone:
                  key: DLA1
                  name: Douala I
                  nameEn: Douala 1
                  region: CM-LT
                  language: fr
                  index: 20
                officialAddress: null
                entrance:
                  lat: 4.0243022
                  lng: 9.6904852
                  kind: centre
                spotCode: CM-DLA1 E0449 N0268
                plusCode: 6FPF2MFR+P5H
                profile:
                  class: residential
                  use: residential
                  kind: building
                  structures: 1
                  floorAreaM2: 852.7
                  rule: single
                  estate: null
                record:
                  machine: CM-DLA1-015-1401-6
                  home: Bonapriso 1401
                  written: Bonapriso 14 01
                  zone: DLA1-015
                  official_name: Bonapriso
                  number: '1401'
                  check: '6'
                  status: provisional
                  issued: bulk
                  issued_at: '2026-10-21T06:05:31Z'
                  entrance_lat: '4.0243022'
                  entrance_lng: '9.6904852'
                  entrance_kind: centre
                  spot_code: CM-DLA1 E0449 N0268
                  official_address: ''
                  class: residential
                  use: residential
                  kind: building
                  structures: '1'
                  floor_area_m2: '852.7'
                  rule: single
                  estate: ''
                credit: N-Ways Addressing for Cameroon, © N-WAYS LIMITED (nways.ng)
                creditUrl: https://github.com/n-ways/open-addresses-cameroon
        '400':
          description: Without its check digit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_code
                  message: A machine code ends with its check digit; use /v1/find to look up a code without it.
        '404':
          description: An area that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unknown_area
                  message: There is no area 999 in zone DLA1.
        '422':
          description: A wrong check digit is refused, not corrected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: check_digit
                  message: 'The check digit does not match: a digit is wrong or two are swapped.'
    patch:
      summary: 'Confirms a code, retires it (for good: its number is never given again), or moves its entrance to the real
        gate or door, at most 80 m away.'
      description: 'Confirms a code, retires it (for good: its number is never given again), or moves its entrance to the
        real gate or door, at most 80 m away and never more than 300 m outside the national border (422 outside). Needs
        `Authorization: Bearer <key>`.'
      operationId: changeCode
      parameters:
      - name: machine
        in: path
        required: true
        description: Machine form with its check digit.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequest'
            example:
              status: confirmed
      security:
      - issuingKey: []
      responses:
        '200':
          description: Confirm a code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              example:
                country: CM
                machine: CM-DLA1-015-2286-3
