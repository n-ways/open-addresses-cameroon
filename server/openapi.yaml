  /v1/at:
    get:
      summary: 'The code of the compound at a point: the nearest live entrance within 12 m (or an outline issued on this server
        that holds the point), as the N-Ways service decides "found".'
      description: 'The code of the compound at a point: the nearest live entrance within 12 m (or an outline issued on this
        server that holds the point), as the N-Ways service decides "found". Otherwise `status: "none"`, the area a new compound
        there would join, and the nearest code within 100 m. A point is in Cameroon when an arrondissement outline holds
        it, or when the spot-code rule gives it a zone ([SPEC §5](../engine/SPEC.md#5-spot-codes)), as the compounds in the
        slivers between outlines and along the shoreline and the border are; a point the rule refuses (no outline within
        12 km, or no frame within 5,000 m) is outside (404 outside).'
      operationId: at
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude, WGS 84 degrees.
        schema:
          type: number
      - name: lng
        in: query
        required: true
        description: Longitude, WGS 84 degrees.
        schema:
          type: number
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/At'
              example:
                status: found
                code:
                  country: CM
                  machine: CM-DLA1-015-1401-6
                  home: Bonapriso 1401
                  written: Bonapriso 14 01
                  spoken: Bonapriso, 14 01
                  number: 1401
                  check: 6
                  status: provisional
                  issued: bulk
                  issuedAt: '2026-10-21T06:05:31Z'
                  area:
                    key: DLA1-015
                    id: 4368
                    plateName: Bonapriso
                    officialName: Bonapriso
                    provisionalName: false
                    zone: DLA1
                    zoneName: Douala I
                  zone:
                    key: DLA1
                    name: Douala I
                    nameEn: Douala 1
                    region: CM-LT
                    language: fr
                    index: 20
                  officialAddress: null
                  entrance:
                    lat: 4.0243022
                    lng: 9.6904852
                    kind: centre
                  spotCode: CM-DLA1 E0449 N0268
                  plusCode: 6FPF2MFR+P5H
                  profile:
                    class: residential
                    use: residential
                    kind: building
                    structures: 1
