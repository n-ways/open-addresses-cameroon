                credit: N-Ways Addressing for Cameroon, © N-WAYS LIMITED (nways.ng)
                creditUrl: https://github.com/n-ways/open-addresses-cameroon
        '400':
          description: A status that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: bad_status
                  message: status is provisional, confirmed or retired.
        '404':
          description: A code that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unknown_code
                  message: There is no code CM-DLA1-015-2929-9.
        '409':
          description: A retired code never comes back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
