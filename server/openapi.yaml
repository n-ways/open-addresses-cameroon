  /v1/near:
    get:
      summary: The codes whose entrance lies within `radius` metres (default 100, at most 500), nearest first, at most `limit`
        (default and maximum 100).
      description: The codes whose entrance lies within `radius` metres (default 100, at most 500), nearest first, at most
        `limit` (default and maximum 100). `total` counts them all. The point must be in Cameroon, as for `GET /v1/at` (404
        outside).
      operationId: near
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude.
        schema:
          type: number
      - name: lng
        in: query
        required: true
        description: Longitude.
        schema:
          type: number
      - name: radius
        in: query
        required: false
        description: Metres, more than 0 and at most 500 (default 100).
        schema:
          type: number
      - name: limit
        in: query
        required: false
        description: Most codes returned (1-100, default 100).
        schema:
          type: integer
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Near'
              example:
                point:
                  lat: 4.0243022
                  lng: 9.6904852
                radiusM: 30.0
                total: 3
                codes:
                - machine: CM-DLA1-015-1401-6
                  home: Bonapriso 1401
                  written: Bonapriso 14 01
                  status: provisional
                  area: DLA1-015
                  entrance:
                    lat: 4.0243022
                    lng: 9.6904852
                  distanceM: 0.0
